[package]
name = "rusty-taskclock"
version = "0.2.2"
edition = "2021"
license = "MIT"
readme = "README.md"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
csv = "1"
eframe = { version = "0.33", default-features = true }
egui = "0.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4", "v5"] }

[dev-dependencies]
tempfile = "3"
