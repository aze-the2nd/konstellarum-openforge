name: TaskClock Qt Release

on:
  push:
    tags:
      - 'taskclock-qt-v*'

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime and test dependencies
        run: python -m pip install PySide6 pytest

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform_name: linux
          - os: windows-latest
            platform_name: win

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#taskclock-qt-v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "DIST_NAME=TaskClock-Qt-v$VERSION-${{ matrix.platform_name }}" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller and PySide6
        run: python -m pip install PySide6 pyinstaller

      - name: Build TaskClock Qt
        working-directory: apps/taskclock_qt
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            pyinstaller --onefile --windowed --name "$DIST_NAME" --add-binary "native/libEGL.so.1:apps/taskclock_qt/native" main.py
          else
            pyinstaller --onefile --windowed --name "$DIST_NAME" main.py
          fi

      - name: Prepare Linux asset
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p release-assets
          cp "apps/taskclock_qt/dist/$DIST_NAME" "release-assets/$DIST_NAME"
          chmod +x "release-assets/$DIST_NAME"
          sha256sum "release-assets/$DIST_NAME" > "release-assets/$DIST_NAME.sha256"

      - name: Prepare Windows asset
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item "apps/taskclock_qt/dist/$env:DIST_NAME.exe" "release-assets/$env:DIST_NAME.exe"
          $hash = (Get-FileHash "release-assets/$env:DIST_NAME.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  release-assets/$env:DIST_NAME.exe" | Out-File -Encoding ascii "release-assets/$env:DIST_NAME.exe.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaskClock-Qt-v${{ env.VERSION }}-${{ matrix.platform_name }}
          path: release-assets/*

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Derive version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#taskclock-qt-v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: TaskClock Qt v${{ env.VERSION }}
          body: |
            TaskClock Qt v${{ env.VERSION }}

            Modern Qt-based desktop app for stamping project time by task.

            Highlights:
            - Dark, modern Qt widget UI.
            - Same task/session workflow as the Python version.
            - App title shows the release version.
            - Linux release bundles a libEGL compatibility shim for minimal environments.

            Assets:
            - Windows: TaskClock-Qt-v${{ env.VERSION }}-win.exe
            - Linux: TaskClock-Qt-v${{ env.VERSION }}-linux
          files: release-assets/*
