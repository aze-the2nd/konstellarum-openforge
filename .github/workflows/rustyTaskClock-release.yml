name: rustyTaskClock release

on:
  push:
    tags:
      - 'rusty-taskclock-v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to release (rusty-taskclock-vX.Y.Z)'
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}

permissions:
  contents: write

jobs:
  release-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/TaskClock/rustyTaskClock
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release

      - name: Package Linux release assets
        id: package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#rusty-taskclock-v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          cp target/release/rusty-taskclock "dist/rustyTaskClock-v${VERSION}-linux-x86_64"
          chmod +x "dist/rustyTaskClock-v${VERSION}-linux-x86_64"
          tar -C dist -czf "dist/rustyTaskClock-v${VERSION}-linux-x86_64.tar.gz" "rustyTaskClock-v${VERSION}-linux-x86_64"
          (cd dist && sha256sum "rustyTaskClock-v${VERSION}-linux-x86_64.tar.gz" > "rustyTaskClock-v${VERSION}-linux-x86_64.tar.gz.sha256")

      - name: Upload Linux release assets
        uses: actions/upload-artifact@v4
        with:
          name: rustyTaskClock-linux-assets
          path: |
            projects/TaskClock/rustyTaskClock/dist/rustyTaskClock-v${{ steps.package.outputs.version }}-linux-x86_64.tar.gz
            projects/TaskClock/rustyTaskClock/dist/rustyTaskClock-v${{ steps.package.outputs.version }}-linux-x86_64.tar.gz.sha256
          if-no-files-found: error

  release-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: projects/TaskClock/rustyTaskClock
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release

      - name: Package Windows release assets
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:RELEASE_TAG -replace '^rusty-taskclock-v', ''
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item 'target/release/rusty-taskclock.exe' "dist/rustyTaskClock-v$version-windows-x86_64.exe"
          Compress-Archive -Path "dist/rustyTaskClock-v$version-windows-x86_64.exe" -DestinationPath "dist/rustyTaskClock-v$version-windows-x86_64.zip" -Force
          $hash = Get-FileHash -Algorithm SHA256 "dist/rustyTaskClock-v$version-windows-x86_64.zip"
          Set-Content -Path "dist/rustyTaskClock-v$version-windows-x86_64.zip.sha256" -Value ("$($hash.Hash.ToLower())  rustyTaskClock-v$version-windows-x86_64.zip")

      - name: Upload Windows release assets
        uses: actions/upload-artifact@v4
        with:
          name: rustyTaskClock-windows-assets
          path: |
            projects/TaskClock/rustyTaskClock/dist/rustyTaskClock-v${{ steps.package.outputs.version }}-windows-x86_64.zip
            projects/TaskClock/rustyTaskClock/dist/rustyTaskClock-v${{ steps.package.outputs.version }}-windows-x86_64.zip.sha256
          if-no-files-found: error

  publish-release:
    needs: [release-linux, release-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Derive release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#rusty-taskclock-v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download Linux assets
        uses: actions/download-artifact@v4
        with:
          name: rustyTaskClock-linux-assets
          path: release-assets/linux

      - name: Download Windows assets
        uses: actions/download-artifact@v4
        with:
          name: rustyTaskClock-windows-assets
          path: release-assets/windows

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: rustyTaskClock v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            release-assets/linux/rustyTaskClock-v${{ steps.version.outputs.version }}-linux-x86_64.tar.gz
            release-assets/linux/rustyTaskClock-v${{ steps.version.outputs.version }}-linux-x86_64.tar.gz.sha256
            release-assets/windows/rustyTaskClock-v${{ steps.version.outputs.version }}-windows-x86_64.zip
            release-assets/windows/rustyTaskClock-v${{ steps.version.outputs.version }}-windows-x86_64.zip.sha256
