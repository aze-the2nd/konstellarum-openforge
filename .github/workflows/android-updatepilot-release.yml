name: AndroidUpdatePilot release

on:
  push:
    tags:
      - 'android-update-pilot-v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to release (android-update-pilot-vX.Y.Z)'
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
  APP_DIR: projects/AndroidUpdatePilot
  KEYSTORE_DIR: ${{ github.workspace }}/.signing
  KEYSTORE_FILE: ${{ github.workspace }}/.signing/android-update-pilot-release.p12
  KEYSTORE_ALIAS: androidupdatepilot
  KEYSTORE_PASSWORD: android-update-pilot
  KEY_PASSWORD: android-update-pilot

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${RELEASE_TAG}" != android-update-pilot-v* ]]; then
            echo "Tag must start with android-update-pilot-v" >&2
            exit 1
          fi

      - name: Derive version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#android-update-pilot-v}"
          IFS='.' read -r major minor patch <<<"$VERSION"
          VERSION_CODE=$((10#$major * 10000 + 10#$minor * 100 + 10#$patch))
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 34 platform
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null

      - name: Restore signing keystore
        id: signing-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.KEYSTORE_DIR }}
          key: android-updatepilot-signing-keystore-v1

      - name: Generate signing keystore
        if: steps.signing-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${KEYSTORE_DIR}"
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout "${KEYSTORE_DIR}/android-update-pilot-release.key.pem" \
            -out "${KEYSTORE_DIR}/android-update-pilot-release.crt.pem" \
            -days 3650 \
            -subj "/CN=AndroidUpdatePilot/O=BlackForest Engineering/C=DE"
          openssl pkcs12 -export \
            -inkey "${KEYSTORE_DIR}/android-update-pilot-release.key.pem" \
            -in "${KEYSTORE_DIR}/android-update-pilot-release.crt.pem" \
            -out "${KEYSTORE_FILE}" \
            -name "${KEYSTORE_ALIAS}" \
            -passout pass:"${KEYSTORE_PASSWORD}"
          rm -f "${KEYSTORE_DIR}/android-update-pilot-release.key.pem" "${KEYSTORE_DIR}/android-update-pilot-release.crt.pem"

      - name: Install Gradle
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_VERSION=8.8
          curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle-dist
          echo "/tmp/gradle-dist/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Build release APK
        shell: bash
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          VERSION_CODE="${{ steps.version.outputs.version_code }}"
          gradle --no-daemon --stacktrace --info assembleRelease \
            -PversionName="$VERSION" \
            -PversionCode="$VERSION_CODE" \
            -PreleaseKeystorePassword="${KEYSTORE_PASSWORD}" \
            -PreleaseKeyAlias="${KEYSTORE_ALIAS}" \
            -PreleaseKeyPassword="${KEY_PASSWORD}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/AndroidUpdatePilot-v${VERSION}.apk"
          sha256sum "dist/AndroidUpdatePilot-v${VERSION}.apk" > "dist/AndroidUpdatePilot-v${VERSION}.apk.sha256"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: AndroidUpdatePilot v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            ${{ env.APP_DIR }}/dist/AndroidUpdatePilot-v${{ steps.version.outputs.version }}.apk
            ${{ env.APP_DIR }}/dist/AndroidUpdatePilot-v${{ steps.version.outputs.version }}.apk.sha256
