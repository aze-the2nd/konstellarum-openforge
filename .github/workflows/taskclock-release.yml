name: TaskClock Release

on:
  push:
    tags:
      - 'taskclock-v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform_name: linux
          - os: windows-latest
            platform_name: win

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#taskclock-v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "DIST_NAME=TaskClock-v$VERSION-${{ matrix.platform_name }}" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Linux GUI libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk tcl tk

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build TaskClock
        working-directory: projects/TaskClock
        shell: bash
        run: pyinstaller --onefile --windowed --name "$DIST_NAME" taskclock.py

      - name: Prepare Linux asset
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p release-assets
          cp "projects/TaskClock/dist/$DIST_NAME" "release-assets/$DIST_NAME"
          chmod +x "release-assets/$DIST_NAME"
          sha256sum "release-assets/$DIST_NAME" > "release-assets/$DIST_NAME.sha256"

      - name: Prepare Windows asset
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item "projects/TaskClock/dist/$env:DIST_NAME.exe" "release-assets/$env:DIST_NAME.exe"
          $hash = (Get-FileHash "release-assets/$env:DIST_NAME.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  release-assets/$env:DIST_NAME.exe" | Out-File -Encoding ascii "release-assets/$env:DIST_NAME.exe.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaskClock-v${{ env.VERSION }}-${{ matrix.platform_name }}
          path: release-assets/*

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Derive version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#taskclock-v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: TaskClock v${{ env.VERSION }}
          body: |
            TaskClock v${{ env.VERSION }}

            Minimal stand-alone desktop app for stamping project time by task.

            Highlights:
            - Modern, minimal TaskClock UI.
            - App title shows the release version.
            - User data is stored in the platform-specific app-data directory.
            - Windows and Linux stand-alone builds are attached below.

            Assets:
            - Windows: TaskClock-v${{ env.VERSION }}-win.exe
            - Linux: TaskClock-v${{ env.VERSION }}-linux
          files: release-assets/*
